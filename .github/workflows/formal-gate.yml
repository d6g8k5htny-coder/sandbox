name: Layer 1 formal gate (Lean kernel replay)
'on':
  pull_request:
    paths: ['formal/**', '.github/workflows/formal-gate.yml']
  push:
    branches: [main]
    paths: ['formal/**', '.github/workflows/formal-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-controls:
    name: gate tests, mutants, pins (no Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pins, tests in both modes, gate replay
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S formal/pin_sources.py --check
          python -B -S formal/run_validation.py --output "$RUNNER_TEMP/formal-gate-run"
          python -B -S - <<'PY'
          import json, os, pathlib
          report = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'formal-gate-run' / 'REPORT.json').read_text())
          if not report['passed'] or report['distinct_tests'] != 27 or report['distinct_semantic_mutants'] != 33:
              raise SystemExit('unexpected gate-control scope')
          if report['mathematical_acceptance'] is not False or report['lemma_closed'] is not False or report['scientific_effect'] != 'NONE':
              raise SystemExit('forbidden scientific promotion')
          print('FORMAL_GATE_CONTROLS_PASSED')
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formal-gate-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/formal-gate-run
          if-no-files-found: error
          retention-days: 30

  lean-kernel:
    name: lake build + #print axioms evidence replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build the pinned Lean project (Mathlib cache)
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: formal/lean
          use-mathlib-cache: true
          build: true
          test: false
          lint: false
          auto-config: false
      - name: Regenerate kernel evidence and compare with committed bytes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/formal-kernel"
          python -B -S formal/lean_build_evidence.py --check | tee "$RUNNER_TEMP/formal-kernel/evidence_check.log"
          python -B -S formal/formal_gate.py --json | tee "$RUNNER_TEMP/formal-kernel/gate_report.txt"
          python -B -S formal/blueprint_check.py | tee "$RUNNER_TEMP/formal-kernel/blueprint_check.txt"
          git diff --exit-code
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formal-kernel-${{ github.run_id }}
          path: ${{ runner.temp }}/formal-kernel
          if-no-files-found: error
          retention-days: 30
